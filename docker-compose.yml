version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: poetry_studio_db
    restart: always
    environment:
      POSTGRES_USER: poetry_user
      POSTGRES_PASSWORD: poetry_pass
      POSTGRES_DB: poetry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poetry_user -d poetry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: poetry_studio_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: poetry_studio_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://poetry_user:poetry_pass@db:5432/poetry_db
      - USE_MOCK_LLM=true
      - USE_MOCK_KEEP=true
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_media:/app/app/static/media

  frontend:
    build: ./frontend
    container_name: poetry_studio_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  backend_media:
